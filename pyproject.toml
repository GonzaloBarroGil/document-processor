[project]
name = "document-processor"
version = "0.1.0"
description = "Web service for processing invoices, tickets, and payment documents via OCR with regional validation."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "minio>=7.2",
    "paddleocr>=2.9",
    "easyocr>=1.7",
    "pillow>=11.0",
    "pillow-heif>=0.20",
    "pdf2image>=1.17",
    "python-multipart>=0.0.18",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-bdd>=8.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "testcontainers>=4.9",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4", "D"]
ignore = ["D100", "D104", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
namespace_packages = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"

[project.scripts]
docproc = "document_processor.cli:main"
docproc-worker = "document_processor.cli.worker:main"
docproc-keys = "document_processor.cli.api_keys:main"

[project.entry-points."document_processor.validators"]
ar = "document_processor.adapters.validators.ar.validator:ArgentinaValidator"
