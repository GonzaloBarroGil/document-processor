name: contract-check

on:
  repository_dispatch:
    types: [contract-change]
  workflow_dispatch:
    inputs:
      ref:
        description: Hub contract ref (branch/sha)
        required: true
        default: main

jobs:
  validate-contract:
    name: Validate server against contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Resolve contract ref
        id: ref
        run: |
          echo "ref=${{ github.event.client_payload.ref || github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"

      - name: Fetch OpenAPI contract
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/GonzaloBarroGil/document-processor-orchestration/${{ steps.ref.outputs.ref }}/docs/contracts/openapi.yaml" \
            -o /tmp/openapi.yaml

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Spectral lint
        run: npx @stoplight/spectral-cli lint /tmp/openapi.yaml

      - name: Static contract comparison
        run: python scripts/check_contract.py /tmp/openapi.yaml
