name: contract-check

on:
  repository_dispatch:
    types: [contract-change]
  workflow_dispatch:
    inputs:
      ref:
        description: Hub contract ref (branch/sha)
        required: true
        default: main

jobs:
  validate-contract:
    name: Validate server against contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: document_processor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Resolve contract ref
        id: ref
        run: |
          echo "ref=${{ github.event.client_payload.ref || github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"

      - name: Fetch OpenAPI contract
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/GonzaloBarroGil/document-processor-orchestration/${{ steps.ref.outputs.ref }}/docs/contracts/openapi.yaml" \
            -o /tmp/openapi.yaml

      - name: Spectral lint
        run: npx @stoplight/spectral-cli lint /tmp/openapi.yaml

      - name: Schemathesis contract test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/document_processor_test
        run: |
          uv run schemathesis run /tmp/openapi.yaml \
            --base-url http://localhost:8000 \
            --checks all \
            --report
