services:
  app:
    build: .
    command: uvicorn document_processor.adapters.web.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./src:/app/src:ro

  worker:
    build: .
    command: docproc-worker
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./src:/app/src:ro

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docproc
      POSTGRES_USER: docproc
      POSTGRES_PASSWORD: docproc
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docproc"]
      interval: 3s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  miniodata:
