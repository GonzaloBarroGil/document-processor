# Document Processor — production compose (template)
#
# Production wiring vs. the dev `docker-compose.yml`:
#   - no source mounts, no published DB/MinIO/API ports (Caddy reaches them on the
#     compose network),
#   - credentials come from `.env.production` (gitignored), never defaults,
#   - `restart: unless-stopped` on every service.
#
# Deploy:  cp .env.production.example .env.production  (edit secrets)
#          docker compose -f deploy/docker-compose.prod.yml up -d
# See document-processor-orchestration/docs/operations.md §4.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started

  app:
    build: ..
    restart: unless-stopped
    command: uvicorn document_processor.adapters.web.server:app --host 0.0.0.0 --port 8000
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build: ..
    restart: unless-stopped
    command: docproc-worker
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docproc"]
      interval: 3s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address :9001
    env_file: .env.production
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:
